    <script>
        function randomColor() {
            let chars = "0123456789ABCDEF";
            let color = "#";

            for (let i = 0; i < 6; i++) {
                const rand = Math.floor(Math.random() * chars.length);
                color += chars[rand];
            }

            return color;
        }
        function generatePalette() {
            const circles = document.querySelectorAll(".palette_circle");
            const texts = document.querySelectorAll(".palette_text");

            let colors = []

            circles.forEach((circle, index) => {
                const color = randomColor();
                colors.push(color)

                circle.style.backgroundColor = color;
                texts[index].textContent = color;
            });
            animateBackground(colors);
        }
        document.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
            e.preventDefault();
            generatePalette();
        }
        });
        function animateBackground(colors) {
            document.body.style.background = `
            linear-gradient(120deg, ${colors.join(", ")})
            `;
            document.body.style.backgroundSize = "400% 400%";
            document.body.style.animation = "bgMove 12s ease infinite";
        }
        document.querySelectorAll(".palette_circle").forEach((circle, index) => {
            circle.addEventListener("click", () => {
                const text = document.querySelectorAll(".palette_text")[index].textContent;
                const textEl = document.querySelectorAll(".palette_text")[index];

                navigator.clipboard.writeText(text);

                textEl.classList.add("copy-effect");

                setTimeout(() => {
                    textEl.classList.remove("copy-effect");
                }, 1000);
            });
        });
    </script>
